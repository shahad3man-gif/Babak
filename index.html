<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Babak – بابك</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b1226;--p:#121a33;--p2:#18213f;--b:#25305a;--t:#e8ecf8;--m:#8d98bd;--a:#6c7bff;--a2:#9b6cff;--ok:#3ecf8e;--w:#f5a524;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f6fb;--p:#fff;--p2:#f0f2fa;--b:#d9deef;--t:#141b34;--m:#5d6890;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}h1,h2,h3{margin:0 0 .4em;line-height:1.2}a{color:var(--a)}
.btn{background:var(--p2);border:1px solid var(--b);padding:8px 14px;border-radius:9px;cursor:pointer}.btn:hover{border-color:var(--a)}
.pri{background:linear-gradient(135deg,var(--a),var(--a2));border:0;color:#fff;font-weight:600}.sm{padding:4px 10px;font-size:13px}.dng{color:#ff7a7a}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:18px}.g{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
input,textarea,select{width:100%;background:var(--p2);border:1px solid var(--b);border-radius:9px;padding:9px 12px;margin:4px 0 12px}label{font-size:13px;color:var(--m)}
.wrap{max-width:1080px;margin:auto;padding:20px}.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--b)}
.logo{font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{text-align:center;padding:70px 20px 40px}.hero h1{font-size:clamp(30px,6vw,54px)}.hero p{color:var(--m);max-width:620px;margin:12px auto 24px}
.bar{height:7px;background:var(--p2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2))}
.chip{display:inline-block;border:1px solid var(--b);background:var(--p2);padding:6px 12px;border-radius:99px;margin:3px;cursor:pointer}.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.sel{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}.tag{font-size:12px;color:var(--m)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.app{display:flex;min-height:calc(100vh - 54px)}.side{width:230px;flex:none;border-inline-end:1px solid var(--b);padding:14px;background:var(--p)}
.side a{display:block;padding:7px 10px;border-radius:8px;color:var(--m);cursor:pointer;text-decoration:none}.side a.on,.side a:hover{background:var(--p2);color:var(--t)}.main{flex:1;min-width:0;padding:20px}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--b);padding:7px 9px;text-align:start;vertical-align:top}th{color:var(--m);font-size:13px}.scroll{overflow-x:auto}
[contenteditable=true]{outline:1px dashed var(--a);border-radius:4px;min-width:20px;display:inline-block}li{margin:3px 0}
.ph{border-inline-start:3px solid var(--b);padding:6px 14px;margin:10px 0}.ph.done{border-color:var(--ok)}.ph.doing{border-color:var(--w)}
.node{background:var(--p2);border:1px solid var(--a);border-radius:10px;padding:10px;text-align:center}.ar{text-align:center;color:var(--a)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.modal .card{max-width:640px;width:100%;max-height:85vh;overflow:auto}
pre{white-space:pre-wrap;background:var(--p2);padding:12px;border-radius:9px;border:1px solid var(--b);font-size:13px}
@media(max-width:760px){.app{flex-direction:column}.side{width:auto;display:flex;overflow-x:auto;border:0;border-bottom:1px solid var(--b)}.side a{white-space:nowrap}}
</style></head><body><div id="app"></div><div id="m"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
/* ---------- Storage + API layer (swap with real backend) ---------- */
const mem={};const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return mem[k]??d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{mem[k]=v}}};
const hash=s=>{let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return(h>>>0).toString(36)};
const api={
 signup(n,e,p){const u=ls.g('bk_u',{});e=e.trim().toLowerCase();if(!e||p.length<6)throw'Valid email and 6+ char password required';if(u[e])throw'Account exists';u[e]={n,h:hash(e+p)};ls.s('bk_u',u);ls.s('bk_s',e)},
 login(e,p){const u=ls.g('bk_u',{});e=e.trim().toLowerCase();if(!u[e]||u[e].h!==hash(e+p))throw'Wrong email or password';ls.s('bk_s',e)},
 me(){const e=ls.g('bk_s',null),u=ls.g('bk_u',{});return e&&u[e]?{e,n:u[e].n||e}:null},logout(){ls.s('bk_s',null)},
 list(){return ls.g('bk_p_'+S.u.e,[])},save(){ls.s('bk_p_'+S.u.e,S.ps)}};
/* ---------- Service catalog ---------- */
const SV=[
['analysis','🧠','Project Analysis','Understand your idea: problem, users, objectives.','Overview · Problem · Users · Objectives',[],['users','problem','goals']],
['req','📋','Requirements Analysis','Turn a client request into clear requirements.','Functional · Non-functional · Priorities',[],['users','features','payments','platform']],
['roles','👥','User & Roles','Identify users and permissions.','Roles · Permissions · Role matrix',[],['users','rolecan']],
['modules','🧩','Feature & Module Planner','Break the system into modules and features.','Modules · Features · Dependencies',['req'],['features','users']],
['pages','🖥️','Page Planner','All pages and what each contains.','Page list · Components · Navigation',['modules'],['features','users','platform']],
['db','🗄️','Database Designer','Tables, fields, relationships, ERD, SQL.','Tables · Relations · ERD · Schema',['req'],['entities','users','payments']],
['arch','🏗️','System Architecture','Frontend, API, backend, DB, external services.','Layers · Diagram',['req'],['platform','features','scale']],
['tech','⚙️','Technology Advisor','Recommended stack with reasons.','Frontend · Backend · DB · Hosting',[],['platform','scale','team']],
['plan','🛣️','Development Planner','Phased step-by-step roadmap.','Phases · Tasks · Order',['modules'],['features','team','timeline']],
['prompts','✨','AI Prompt Generator','Ready-to-use prompts for AI coding tools.','Context · Requirements · Constraints',[],['task','tech','constraints']],
['tests','🧪','Testing Generator','Test cases from your requirements.','Scenarios · Edge cases · Expected results',['req'],['features','users']],
['security','🔐','Security Review','Risks and a security checklist.','Risks · Recommendations · Checklist',[],['users','payments','platform']],
['docs','📚','Documentation Generator','Technical and user documentation outline.','Docs · API · Install · User guide',[],['features','tech'] ]
].map(a=>({id:a[0],i:a[1],n:a[2],d:a[3],g:a[4],dep:a[5],q:a[6]}));const svc=id=>SV.find(s=>s.id===id);
const Q={users:{t:'Who will use this system?',k:'multi',o:['Admin','Manager','Employee','Customer','Guest']},
rolecan:{t:()=>`What should the ${firstRole()||'Employee'} be able to do?`,k:'text',h:'e.g. take orders, view reports'},
problem:{t:'What problem are you solving, and for whom?',k:'text'},goals:{t:'What are the main goals of the project?',k:'text'},
features:{t:'List the main features (comma-separated).',k:'text',h:'Orders, Inventory, Products, Reports'},
payments:{t:'Does the system require payments?',k:'single',o:['Yes','No','Not sure']},
platform:{t:'Which platform?',k:'single',o:['Web Application','Mobile App','Web + Mobile','API only']},
entities:{t:'What are the main data entities? (comma-separated)',k:'text',h:'Products, Orders, Inventory'},
scale:{t:'Expected scale?',k:'single',o:['Small (<1k users)','Medium','Large (100k+)']},
team:{t:'Team size & skills?',k:'text',h:'2 devs, React + Node'},timeline:{t:'Target timeline?',k:'single',o:['1 month','3 months','6 months','Flexible']},
task:{t:'Which development task do you need a prompt for?',k:'text',h:'Create Authentication API'},
tech:{t:'Preferred technology (or leave blank for suggestions)',k:'text',h:'Node.js, Express, PostgreSQL'},
constraints:{t:'Any constraints or exclusions?',k:'text'}};
const firstRole=()=>(S.cur?.ctx.users||[]).find(r=>r!=='Admin');
/* ---------- Local fallback generator ---------- */
const L=v=>Array.isArray(v)?v:String(v||'').split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);
const sing=s=>s.replace(/ies$/i,'y').replace(/s$/i,'');
function local(id,p){const c=p.ctx,U=L(c.users).length?L(c.users):['Admin','User'],F=L(c.features).length?L(c.features):['Core feature'],E=L(c.entities).length?L(c.entities):F;
const T=(title,text,copy)=>({type:'text',title,text,copy}),Li=(title,items)=>({type:'list',title,items}),Tb=(title,columns,rows)=>({type:'table',title,columns,rows});
const S_={
analysis:[T('Project Overview',`${p.name} is a ${p.type||'software'} project. ${p.desc}`),T('Problem',c.problem||p.goal||'To be refined.'),Li('Target Users',U),Li('Objectives',L(c.goals).length?L(c.goals):[p.goal||'Deliver a working MVP']),Li('Scope',F)],
req:[Tb('Functional Requirements',['ID','Requirement','Priority'],[['FR-01','User authentication','High'],...F.map((f,i)=>['FR-'+String(i+2).padStart(2,'0'),'Manage '+f,i<3?'High':'Medium'])]),Li('Non-Functional Requirements',['Security: hashed passwords, RBAC, HTTPS','Performance: pages under 2s','Scalability: '+(c.scale||'horizontal scaling ready'),'Availability: 99.5%']),Li('Acceptance Criteria',F.map(f=>f+' can be created, viewed, edited and deleted by authorized roles'))],
roles:[Tb('Roles & Permissions',['Role',...F],U.map(r=>[r,...F.map(()=>r==='Admin'?'✓':r==='Guest'?'–':'view')])),Li('Role Notes',[firstRole()?firstRole()+': '+(c.rolecan||'to be defined'):'Define role responsibilities'])],
modules:[Tb('Modules',['Module','Features','Depends on'],[['Auth','Login, roles, sessions','–'],...F.map(f=>[f,'List, create, edit, delete, search','Auth']),['Reports','Summaries & export',F.join(', ')]])],
pages:[Tb('Pages',['Page','Contains','Roles'],[['Login','Form, errors','All'],['Dashboard','Stats, shortcuts','Staff'],...F.flatMap(f=>[[f+' list','Table, filters, search','Staff'],[f+' form','Fields, validation','Staff']]),['Settings','Profile, preferences','All']])],
db:[{type:'db',title:'Schema',tables:[{name:'users',fields:['id PK','name','email','role','created_at']},...E.map(e=>({name:e.toLowerCase().replace(/\s+/g,'_'),fields:['id PK','user_id FK','name','status','created_at']}))],relations:E.map(e=>['users',e.toLowerCase().replace(/\s+/g,'_'),'1:N'])}],
arch:[{type:'flow',title:'Architecture',nodes:[p.type||'Web','Frontend (UI)','API layer (REST)','Backend services','Database','External services'+(/yes/i.test(c.payments)?' (payments)':'')]}],
tech:[Tb('Recommended Stack',['Layer','Choice','Reason'],[['Frontend','React + Vite','Fast, large ecosystem'],['Backend','Node.js + Express','Same language end-to-end'],['Database','PostgreSQL','Relational, reliable'],['Hosting','Docker on a managed cloud','Portable'],['Auth','JWT + bcrypt','Standard']])],
plan:[{type:'phases',title:'Roadmap',phases:['Project Setup','Authentication',...F,'Testing','Deployment'].map((n,i)=>({name:n,status:i<1?'done':i<2?'doing':'todo',tasks:['Create database','Create API','Create UI','Testing']}))}],
prompts:[T('Prompt',`PROJECT CONTEXT\n${p.name}: ${p.desc}\nUsers: ${U.join(', ')}\n\nTASK\n${c.task||'Create Authentication API'}\n\nTECHNOLOGY\n${c.tech||'Node.js, Express, PostgreSQL'}\n\nREQUIREMENTS\n- Follow clean architecture (routes/controllers/services)\n- Validate all input\n\nCONSTRAINTS\n${c.constraints||'None'}\n\nSECURITY RULES\n- Hash passwords, parameterized queries, rate limit login\n\nEXPECTED RESULT\nWorking code, file structure and run instructions.`,true)],
tests:[Tb('Test Cases',['Scenario','Expected','Type'],[['Login with valid credentials','Access granted','Happy'],['Login with wrong password','Error, no access','Edge'],...F.map(f=>['Create '+sing(f),'Saved & listed','Happy']),...F.map(f=>['Create '+sing(f)+' with empty fields','Validation error','Edge']),['Unauthorized role opens admin page','403 / redirect','Security']])],
security:[Li('Risks',['Broken access control between roles','SQL injection / XSS','Weak password storage',/yes/i.test(c.payments)?'Payment data exposure (use a PCI provider)':'Sensitive data exposure']),Li('Checklist',['HTTPS everywhere','Hash passwords (bcrypt/argon2)','Enforce RBAC server-side','Rate-limit auth endpoints','Validate & sanitize input','Audit logging','Backups'])],
docs:[Li('Documentation Outline',['Overview','Installation guide','Configuration','API reference: '+F.join(', '),'User guide per role','Deployment','Troubleshooting'])]}[id];return{sections:S_}}
/* ---------- AI adapter: Claude via `sample` capability, local fallback ---------- */
const AI={async gen(id,p,ins){let s=null;try{s=await window.claude?.use('sample')}catch{}
 if(!s)return{...local(id,p),src:'Local engine'};
 const prompt=`You are Babak, a software planning assistant. Produce the "${svc(id).n}" deliverable for this project. Write all text values in ${lang==='ar'?'Arabic':'English'} (keep JSON keys and type values in English). Return ONLY JSON: {"sections":[...]} where each section is one of:
{"type":"text","title":"","text":""} | {"type":"list","title":"","items":[""]} | {"type":"table","title":"","columns":[""],"rows":[[""]]} | {"type":"phases","title":"","phases":[{"name":"","status":"todo","tasks":[""]}]} | {"type":"db","title":"","tables":[{"name":"","fields":["id PK","user_id FK"]}],"relations":[["from_table","to_table","1:N"]]} | {"type":"flow","title":"","nodes":[""]}. Add "copy":true on a text section that is a prompt. Be concrete and specific to the project.
PROJECT: ${JSON.stringify({name:p.name,type:p.type,desc:p.desc,targetUsers:p.users,goal:p.goal,answers:p.ctx})}
${p.results&&Object.keys(p.results).length?'EXISTING RESULTS (keep consistent): '+JSON.stringify(Object.fromEntries(Object.entries(p.results).map(([k,v])=>[k,v.sections.map(x=>x.title)]))):''}
${ins?'USER INSTRUCTION FOR THIS RUN: '+ins:''}`;
 try{const r=await s.json(prompt,{cache:false});if(r?.sections?.length)return{sections:r.sections,src:'Claude'}}catch(e){}
 return{...local(id,p),src:'Local engine'}}};
/* ---------- State ---------- */
let S={u:api.me(),view:'landing',ps:[],cur:null,sel:[],tab:'overview',edit:false,qid:null,proc:null};
if(S.u)S.ps=api.list();
const go=(v,x)=>{Object.assign(S,x||{},{view:v});R();scrollTo(0,0)};
const prog=p=>p.services.length?Math.round(p.services.filter(s=>p.results[s]).length/p.services.length*100):0;
const mod=h=>{$('#m').innerHTML=h?`<div class="modal" onclick="if(event.target===this)mod()"><div class="card">${h}</div></div>`:'';tr($('#m'))};
const toast=t=>mod(`<p>${esc(t)}</p><button class="btn" onclick="mod()">OK</button>`);
/* ---------- Views ---------- */
function R(){const a=$('#app');a.innerHTML=({landing:vLanding,auth:vAuth,dash:vDash,wiz:vWiz,pick:vPick,ask:vAsk,ctx:vCtx,proc:vProc,ws:vWs,bp:vBp}[S.view])();document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';tr(a)}
const nav=(r='')=>`<div class="nav"><span class="logo" style="cursor:pointer" onclick="go(S.u?'dash':'landing')">Babak · بابك</span><span class="row">${r}<button class="btn sm" onclick="setLang()">${lang==='ar'?'English':'العربية'}</button>${S.u?`<span class="tag">${esc(S.u.n)}</span><button class="btn sm" onclick="api.logout();S.u=null;go('landing')">Logout</button>`:''}</span></div>`;
function vLanding(){return nav(S.u?'':'<button class="btn sm" onclick="authMode=\'login\';go(\'auth\')">Login</button>')+`<div class="hero"><span class="tag">From Client Idea to Development Blueprint</span><h1>Turn Your Idea Into a Development Plan.</h1><p style="font-size:18px">حوّل فكرتك إلى مشروع قابل للتنفيذ.</p><p>Babak helps developers transform client ideas and project requirements into structured plans, architecture, tasks, AI prompts, testing plans and documentation.</p><div class="row" style="justify-content:center"><button class="btn pri" onclick="S.u?go('dash'):(authMode='signup',go('auth'))">Get Started</button><button class="btn" onclick="$('#svs').scrollIntoView({behavior:'smooth'})">Explore Services</button></div></div>
<div class="wrap"><div class="g g3" style="margin-bottom:30px">${['Choose your service','Answer smart questions','AI processes it','Review & edit','Export blueprint'].map((t,i)=>`<div class="card"><div class="tag">STEP 0${i+1}</div><b>${t}</b></div>`).join('')}</div><h2 id="svs">13 services, pick what you need</h2><div class="g g3">${SV.map(s=>`<div class="card"><div style="font-size:26px">${s.i}</div><b>${s.n}</b><p class="tag">${s.d}</p></div>`).join('')}</div></div>`}
let authMode='signup';
function vAuth(){const su=authMode==='signup';return nav()+`<div class="wrap" style="max-width:420px"><div class="card"><h2>${su?'Create Account':'Login'}</h2><div id="err" class="dng"></div>${su?'<label>Name</label><input id="an">':''}<label>Email</label><input id="ae" type="email"><label>Password</label><input id="ap" type="password"><button class="btn pri" style="width:100%" onclick="doAuth()">${su?'Create Account':'Login'}</button><div class="row" style="margin-top:12px"><button class="btn sm" onclick="authMode='${su?'login':'signup'}';R()">${su?'I have an account':'Create account'}</button><button class="btn sm" onclick="toast('Continue with Google and Forgot Password need a server (OAuth / email). The UI hooks are ready in the api layer.')">Continue with Google</button><button class="btn sm" onclick="toast('Password reset needs an email service on the backend.')">Forgot password</button></div></div></div>`}
function doAuth(){try{const e=$('#ae').value,p=$('#ap').value;authMode==='signup'?api.signup($('#an').value,e,p):api.login(e,p);S.u=api.me();S.ps=api.list();go('dash')}catch(x){$('#err').textContent=lang==='ar'?trs(x):x}}
function vDash(){return nav()+`<div class="wrap"><div class="row"><div class="sp"><h1>Welcome back 👋</h1><p class="tag">What are you building today?</p></div><button class="btn pri" onclick="newP()">+ New Project</button></div><h2 style="margin-top:20px">My Projects</h2>${S.ps.length?`<div class="g g3">${S.ps.slice().sort((a,b)=>b.upd-a.upd).map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="tag">${esc(p.type||'')}</div><div class="row" style="margin:10px 0"><span class="sp bar"><i style="width:${prog(p)}%"></i></span><span class="tag">${prog(p)}%</span></div><div class="tag">${esc(p.status)} · Updated ${new Date(p.upd).toLocaleDateString()}</div><div class="tag">${p.services.map(s=>svc(s)?.i).join(' ')}</div><div class="row" style="margin-top:10px"><button class="btn sm pri" onclick="openP('${p.id}')">Open Project</button><button class="btn sm dng" onclick="delP('${p.id}')">Delete</button></div></div>`).join('')}</div>`:'<div class="card tag">No projects yet. Create your first one.</div>'}</div>`}
function newP(){S.cur={id:uid(),name:'',type:'Web Application',desc:'',users:'',goal:'',services:[],ctx:{},results:{},status:'Draft',upd:Date.now()};S.sel=[];go('wiz')}
function openP(id){S.cur=S.ps.find(p=>p.id===id);S.tab='overview';go(S.cur.services.length&&Object.keys(S.cur.results).length?'ws':'wiz')}
function delP(id){if(confirm(lang==='ar'?AR['Delete project?']:'Delete project?')){S.ps=S.ps.filter(p=>p.id!==id);api.save();R()}}
function persist(){S.cur.upd=Date.now();const i=S.ps.findIndex(p=>p.id===S.cur.id);i<0?S.ps.push(S.cur):S.ps[i]=S.cur;api.save()}
function vWiz(){const p=S.cur;return nav()+`<div class="wrap" style="max-width:640px"><div class="tag">STEP 1 OF 3 · Project Information</div><div class="card"><label>Project Name</label><input id="pn" value="${esc(p.name)}" placeholder="Restaurant Management System"><label>Project Type</label><select id="pt">${['Web Application','Mobile App','SaaS','E-commerce','Internal Tool','API / Backend'].map(o=>`<option value="${o}" ${o===p.type?'selected':''}>${o}</option>`).join('')}</select><label>Short Description</label><textarea id="pd" rows="3" placeholder="I want to build a system to manage orders, inventory, employees and reports.">${esc(p.desc)}</textarea><label>Target Users</label><input id="pu" value="${esc(p.users)}"><label>Project Goal</label><input id="pg" value="${esc(p.goal)}"><button class="btn pri" onclick="saveW()">Continue</button></div></div>`}
function saveW(){const p=S.cur;p.name=$('#pn').value.trim();p.type=$('#pt').value;p.desc=$('#pd').value.trim();p.users=$('#pu').value;p.goal=$('#pg').value;if(!p.name||!p.desc)return toast('Project name and description are required.');persist();S.sel=p.services.slice();go('pick',{adding:false})}
function vPick(){const m=S.sel.map(id=>svc(id)).flatMap(s=>s.dep).filter((d,i,a)=>!S.sel.includes(d)&&!S.cur.services.includes(d)&&a.indexOf(d)===i);
return nav()+`<div class="wrap"><div class="tag">STEP 2 OF 3</div><h2>What do you need help with?</h2><div class="row" style="align-items:flex-start"><div class="sp g g3">${SV.filter(s=>!S.adding||!S.cur.services.includes(s.id)).map(s=>`<div class="card ${S.sel.includes(s.id)?'sel':''}"><div style="font-size:24px">${s.i}</div><b>${s.n}</b><p class="tag">${s.d}</p><div class="tag"><b>You will get:</b> ${s.g}</div><button class="btn sm ${S.sel.includes(s.id)?'pri':''}" onclick="tog('${s.id}')">${S.sel.includes(s.id)?'Selected ✓':'Select'}</button></div>`).join('')}</div>
<div class="card" style="position:sticky;top:10px;min-width:230px"><b>Selected Services</b><div>${S.sel.length} selected</div><div class="tag">Estimated processing: Ready</div>${m.length?`<div class="card" style="margin:10px 0;border-color:var(--w)"><b>Recommended</b><p class="tag">Works better with ${m.map(d=>svc(d).n).join(', ')}. You can continue without it.</p><button class="btn sm" onclick="S.sel.push(...${JSON.stringify(m)});R()">Add</button></div>`:''}<button class="btn pri" style="width:100%" onclick="S.sel.length?startQ():toast('Select at least one service.')">Continue</button></div></div></div>`}
